trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.10'

stages:

# ============================================================
# STAGE 1 - BUILD
# ============================================================

- stage: Build
  displayName: "Build Application"

  jobs:
  - job: BuildJob
    displayName: "Python Build"

    steps:

    - checkout: self
      fetchDepth: 0

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true

    - script: |
        python --version
        python -m pip --version
        pwd
        ls -la
      displayName: "Verify Environment"

    - script: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools wheel
      displayName: "Upgrade Pip Tools"

    - script: |
        pip install -r requirement.txt
      displayName: "Install Dependencies"

    - script: |
        python -m py_compile app.py
        python -m py_compile house.py
      displayName: "Validate Python Files"

# ============================================================
# STAGE 2 - SONARCLOUD ANALYSIS
# ============================================================

- stage: SonarCloud
  displayName: "SonarCloud Analysis"
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: SonarAnalysis
    displayName: "Run SonarCloud"

    steps:

    - checkout: self
      fetchDepth: 0

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools wheel
        pip install -r requirement.txt
      displayName: "Install Dependencies"

    - task: SonarCloudPrepare@3
      inputs:
        SonarCloud: 'SonarCloud-ServiceConnection'
        organization: 'rahulnavi26'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'rahulnavi26_Devops-pipelines'
        cliProjectName: 'Devops-pipelines'
        cliSources: '.'

    - task: SonarCloudAnalyze@3
      displayName: "Run SonarCloud Analysis"

    - task: SonarCloudPublish@3
      inputs:
        pollingTimeoutSec: '300'
      displayName: "Publish Quality Gate"

# ============================================================
# STAGE 3 - TRIVY SECURITY SCAN
# ============================================================

- stage: Trivy
  displayName: "Trivy Security Scan"
  dependsOn: SonarCloud
  condition: succeeded()

  jobs:
  - job: TrivyScan
    displayName: "Filesystem Scan"

    steps:

    - checkout: self

    - script: |
        sudo apt-get update
        sudo apt-get install wget -y

        wget -qO - https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

        trivy --version
      displayName: "Install Trivy"

    - script: |
        trivy fs . \
          --severity HIGH,CRITICAL \
          --exit-code 1
      displayName: "Run Trivy Scan"

# ============================================================
# STAGE 4 - RUN FLASK APPLICATION
# ============================================================

- stage: RunApp
  displayName: "Run Flask App"
  dependsOn: Trivy
  condition: succeeded()

  jobs:
  - job: FlaskRun
    displayName: "Start Flask Application"

    steps:

    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools wheel
        pip install -r requirement.txt
      displayName: "Install Dependencies"

    - script: |
        nohup python app.py > flask.log 2>&1 &
        sleep 15

        echo "Application started"
        cat flask.log
      displayName: "Start Flask Application"