trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.10'

# ============================================================
# STAGE 1 - BUILD
# ============================================================

stages:

- stage: Build
  displayName: "Build Application"

  jobs:
  - job: BuildJob
    displayName: "Python Build"

    steps:

    - checkout: self
      fetchDepth: 0

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true

    - script: |
        python --version
        pwd
        ls -la
      displayName: "Verify Environment"

    - script: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools wheel
      displayName: "Upgrade Pip Tools"

    - script: |
        pip install -r requirement.txt
      displayName: "Install Dependencies"

    - script: |
        python -m py_compile app.py
        python -m py_compile house.py
      displayName: "Validate Python Files"

# ============================================================
# STAGE 2 - SONARCLOUD
# ============================================================

- stage: SonarCloud
  displayName: "SonarCloud Analysis"

  dependsOn: Build

  jobs:
  - job: SonarAnalysis
    displayName: "Run SonarCloud"

    steps:

    - checkout: self
      fetchDepth: 0

    - task: SonarCloudPrepare@3
      inputs:
        SonarCloud: 'SonarCloud-ServiceConnection'
        organization: 'rahulnavi26'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: 'rahulnavi26_Devops-pipelines'
        cliProjectName: 'Devops-pipelines'
        cliSources: '.'

    - task: SonarCloudAnalyze@3
      displayName: 'Run SonarCloud Analysis'

    - task: SonarCloudPublish@3
      inputs:
        pollingTimeoutSec: '300'
      displayName: 'Publish Quality Gate'

# ============================================================
# STAGE 3 - TRIVY SCAN
# ============================================================

- stage: Trivy
  displayName: "Trivy Security Scan"

  dependsOn: SonarCloud

  jobs:
  - job: TrivyScan
    displayName: "Filesystem Scan"

    steps:

    - checkout: self

    - script: |
        sudo apt-get update
        sudo apt-get install wget -y

        wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.66.0_Linux-64bit.deb

        sudo dpkg -i trivy_0.66.0_Linux-64bit.deb
      displayName: "Install Trivy"

    - script: |
        trivy fs . --severity HIGH,CRITICAL
      displayName: "Run Trivy Scan"

# ============================================================
# STAGE 4 - RUN FLASK APP
# ============================================================

- stage: RunApp
  displayName: "Run Flask App"

  dependsOn: Trivy

  jobs:
  - job: FlaskRun

    steps:

    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools wheel
        pip install -r requirement.txt
      displayName: "Install Dependencies"

    - script: |
        python app.py &
        sleep 15
      displayName: "Start Flask Application"