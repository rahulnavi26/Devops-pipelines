trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:

# Checkout Code
- checkout: self
  fetchDepth: 0

# Setup Python
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
    addToPath: true
  displayName: 'Setup Python'

# Upgrade pip
- script: |
    python -m pip install --upgrade pip
  displayName: 'Upgrade Pip'

# Install Dependencies
- script: |
    pip install -r requirement.txt
  displayName: 'Install Dependencies'

# =====================================
# SonarQube Cloud Preparation
# =====================================

- task: SonarCloudPrepare@3
  displayName: 'Prepare SonarCloud Analysis'
  inputs:
    SonarCloud: 'SonarCloud-ServiceConnection'
    organization: 'rahulnavi26'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: 'rahulnavi26_Devops-pipelines'
    cliProjectName: 'Devops-pipelines'
    cliSources: '.'

# Run Analysis
- task: SonarCloudAnalyze@3
  displayName: 'Run SonarCloud Analysis'

# Publish Quality Gate
- task: SonarCloudPublish@3
  displayName: 'Publish Quality Gate'
  inputs:
    pollingTimeoutSec: '300'

# =====================================
# Install Trivy
# =====================================

- script: |
    sudo apt-get update
    sudo apt-get install wget -y

    wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.66.0_Linux-64bit.deb

    sudo dpkg -i trivy_0.66.0_Linux-64bit.deb
  displayName: 'Install Trivy'

# =====================================
# Trivy Filesystem Scan
# =====================================

- script: |
    trivy fs . --severity HIGH,CRITICAL
  displayName: 'Run Trivy Scan'